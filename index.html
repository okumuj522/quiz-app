<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Master</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Quiz Master</h1>

        <!-- QUIZ SCREEN -->

        <div id="quiz">

            <div class="quiz-header">

                <span id="questionNumber">
                    Question 1 of 50
                </span>

                <span id="score">
                    Score: 0
                </span>

                <span id="timer">
                    Time: 30
                </span>

            </div>


            <!-- Progress Bar -->

            <div class="progress-container">

                <div id="progressBar"></div>

            </div>


            <h2 id="question">
                Question will appear here
            </h2>


            <div id="answers"></div>


            <button id="nextButton">
                Next Question
            </button>

        </div>


        <!-- RESULT SCREEN -->

        <div id="result" class="hidden">

            <h2>🎉 Quiz Complete!</h2>

            <div class="result-box">

                <p id="finalScore">
                    Score: 0 / 50
                </p>

                <p id="percentage">
                    Percentage: 0%
                </p>

                <p id="resultMessage">
                    Keep practicing!
                </p>

            </div>


            <button id="restartButton">
                Restart Quiz
            </button>

        </div>


        <!-- RECORDS -->

        <div class="records">

            <h2>Quiz Records</h2>

            <p id="bestScore">
                Best Score: 0%
            </p>

            <div id="history"></div>

            <button id="clearHistory">
                Clear Records
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
